<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappa Percorsi GPX</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; display: flex; }
#sidebar { width: 320px; height: 100%; background: #f8f9fa; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; z-index: 1000; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
#sidebar h2 { margin-top: 0; font-size: 1.2rem; margin-bottom: 20px; }
.filter-group { margin-bottom: 18px; }
.filter-group label { display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 6px; }
.filter-group select { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; }
.checkbox-group { display: flex; gap: 15px; margin-top: 5px; }
.checkbox-group label { font-weight: normal; font-size: 0.85rem; cursor: pointer; }
.range-val { float: right; font-size: 0.85rem; color: #555; font-weight: normal; }
.range-sliders { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-row span { font-size: 0.75rem; color: #666; width: 30px; }
.slider-row input[type="range"] { flex: 1; }
#stats { font-style: italic; color: #777; font-size: 0.85rem; margin-top: 25px; }
#map { flex: 1; height: 100%; }
.leaflet-interactive { filter: drop-shadow(0px 0px 3px currentColor); transition: stroke-width 0.15s ease; }
.popup-right { margin-bottom: 0 !important; }
.popup-right .leaflet-popup-tip-container { display: none !important; }
.popup-right .leaflet-popup-content-wrapper { position: relative; border-radius: 12px; padding: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
.popup-right .leaflet-popup-content-wrapper::before { content: ""; position: absolute; left: -6px; bottom: 26px; width: 14px; height: 14px; background: #ffffff; transform: rotate(45deg); z-index: -1; box-shadow: -2px 2px 3px rgba(0,0,0,0.15); border-radius: 2px; }
.popup-right .leaflet-popup-content { margin: 16px 22px 16px 16px !important; padding-right: 14px !important; max-height: 320px !important; overflow-y: auto !important; line-height: 1.5; color: #333; }
@media (max-width: 768px) {
  body { flex-direction: column; }
  #sidebar { width: 100%; height: auto; max-height: 40vh; }
  #map { height: 60vh; }
}
</style>
</head>
<body>

<div id="sidebar">
  <h2>Filtri Percorsi</h2>
  
  <div class="filter-group">
    <label>Stato Percorso:</label>
    <div class="checkbox-group">
      <label><input type="checkbox" id="chk-fatte" checked> Completati</label>
      <label><input type="checkbox" id="chk-non-fatte" checked> Da Fare</label>
    </div>
  </div>

  <div class="filter-group">
    <label for="filter-difficolta">Difficoltà:</label>
    <select id="filter-difficolta">
      <option value="Tutte">Tutte</option>
      <option value="Facile">Facile</option>
      <option value="Media">Media</option>
      <option value="Difficile">Difficile</option>
      <option value="Molto Difficile">Molto Difficile</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Distanza (Km): <span id="val-dist" class="range-val">0 - 50 km</span></label>
    <div class="range-sliders">
      <div class="slider-row"><span>Min:</span><input type="range" id="filter-dist-min" min="0" max="50" value="0" step="1"></div>
      <div class="slider-row"><span>Max:</span><input type="range" id="filter-dist-max" min="0" max="50" value="50" step="1"></div>
    </div>
  </div>

  <div class="filter-group">
    <label>Dislivello + (m): <span id="val-dis-pos" class="range-val">0 - 2500 m</span></label>
    <div class="range-sliders">
      <div class="slider-row"><span>Min:</span><input type="range" id="filter-dis-pos-min" min="0" max="2500" value="0" step="50"></div>
      <div class="slider-row"><span>Max:</span><input type="range" id="filter-dis-pos-max" min="0" max="2500" value="2500" step="50"></div>
    </div>
  </div>

  <div class="filter-group">
    <label>Dislivello - (m): <span id="val-dis-neg" class="range-val">0 - 2500 m</span></label>
    <div class="range-sliders">
      <div class="slider-row"><span>Min:</span><input type="range" id="filter-dis-neg-min" min="0" max="2500" value="0" step="50"></div>
      <div class="slider-row"><span>Max:</span><input type="range" id="filter-dis-neg-max" min="0" max="2500" value="2500" step="50"></div>
    </div>
  </div>

  <div class="filter-group">
    <label for="filter-durata">Categoria Durata:</label>
    <select id="filter-durata">
      <option value="Tutte">Tutte</option>
      <option value="Mezza Giornata">Mezza Giornata</option>
      <option value="Giornata Intera">Giornata Intera</option>
    </select>
  </div>

  <div class="filter-group" style="margin-top: 25px; padding-top: 15px; border-top: 1px solid #ddd;">
    <label style="margin-bottom: 10px; color: #2c3e50;">Pianificatore Meteo (3 Giorni):</label>
    <div style="margin-bottom: 8px;">
      <label><input type="checkbox" id="chk-autoupdate-meteo" checked> Autoupdate meteo locale (su traccia)</label>
    </div>
    <label for="data-partenza" style="font-size: 0.85rem; font-weight: normal; margin-bottom: 2px;">Data escursione:</label>
    <input type="date" id="data-partenza" style="width: 100%; margin-bottom: 8px; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
    
    <label for="ora-partenza" style="font-size: 0.85rem; font-weight: normal; margin-bottom: 2px;">Ora di partenza (locale):</label>
    <input type="time" id="ora-partenza" value="10:00" style="width: 100%; margin-bottom: 10px; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
    
    <button id="btn-meteo" style="width: 100%; padding: 8px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Controlla Meteo Percorso
    </button>
    <div id="risultato-meteo" style="margin-top: 8px; margin-bottom: 15px; font-size: 0.85rem;">Passa col mouse su un percorso per i dettagli</div>

    <div id="regione-meteo-controls" style="background: #edf2f7; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e0;">
      <label style="color: #2d3748; font-size: 0.85rem; margin-bottom: 4px;"><strong>Heatmap Pioggia Regionale:</strong></label>
      <div style="font-size: 0.85rem; color: #4a5568; margin-bottom: 4px;">Ora selezionata: <span id="time-display" style="font-weight: bold;">12:00</span></div>
      <input type="range" id="time-slider" min="0" max="7" value="4" step="1" style="width: 100%; margin: 5px 0;" oninput="changeForecastStep(this.value)">
      <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: #718096;">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>21:00</span>
      </div>
    </div>
  </div>

  <div id="stats">Mostrati: 0 di 0 percorsi</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<script>
const oggi = new Date();
const dopodomani = new Date();
dopodomani.setDate(oggi.getDate() + 2);

const formattaData = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const inputData = document.getElementById('data-partenza');
inputData.min = formattaData(oggi);
inputData.max = formattaData(dopodomani);
inputData.value = formattaData(new Date(oggi.getTime() + 86400000)); 

let allData = null;
let geoJsonLayer = null;
let selectedLayerForMeteo = null;
const trackMeteoCache = new Map();
let hoverMeteoTimeout = null;

const intervals = [0, 3, 6, 9, 12, 15, 18, 21];
let currentStepIndex = 4;
let heatmap3DaysCache = null;

let heatLayer = L.heatLayer([], {
  radius: 80, 
  blur: 55, 
  maxZoom: 12,
  max: 100,
  minOpacity: 0.3,
  gradient: { 0.15: '#00bfff', 0.45: '#0000ff', 0.75: '#ffaa00', 1.00: '#ff0000' }
});

const map = L.map('map').setView([46.4983, 11.3548], 10);
const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17,
  attribution: 'Map data: © OpenStreetMap contributors | Map style: © OpenTopoMap'
}).addTo(map);

L.control.layers({ "OpenTopoMap": topoLayer }, { "Heatmap Precipitazioni": heatLayer }, { collapsed: false }).addTo(map);

map.on('overlayadd', function(e) {
  if (e.layer === heatLayer) { 
    load3DaysWeatherGrid(); 
  }
});

function getNeonColor(difficolta) {
  switch (difficolta) {
    case 'Facile': return '#00FF66';
    case 'Media': return '#00E5FF';
    case 'Difficile': return '#FF5F00';
    case 'Molto Difficile': return '#FF007F';
    default: return '#00FF66';
  }
}

function getMeteoEmoji(weatherCode) {
  switch (weatherCode) {
    case 0: return '☀️';
    case 1: case 2: return '⛅';
    case 3: return '☁️';
    case 45: case 48: return '🌫️';
    case 51: case 53: case 55: case 56: case 57: 
    case 61: case 63: case 65: case 66: case 67: return '🌧️';
    case 71: case 73: case 75: case 77: case 85: case 86: return '❄️';
    case 80: case 81: case 82: return '🌦️';
    case 95: case 96: case 99: return '⚡';
    default: return '☁️';
  }
}

function getMeteoSeverity(emoji) {
  switch (emoji) {
    case '⚡': return 8; case '❄️': return 7; case '🌧️': return 6;
    case '🌦️': return 5; case '🌫️': return 4; case '☁️': return 3;
    case '⛅': return 2; case '☀️': return 1; default: return 0;
  }
}

function onEachFeature(feature, layer) {
  const p = feature.properties;
  layer.bindPopup(`<strong>${p.name}</strong><br>Distanza: ${p.km} km<br>Difficoltà: ${p.difficolta}`, { className: 'popup-right', minWidth: 285 });

  layer.on('mouseover', function(e) {
    selectedLayerForMeteo = layer;
    layer.setStyle({ weight: 8, opacity: 1 });
    if (document.getElementById('chk-autoupdate-meteo').checked) {
      clearTimeout(hoverMeteoTimeout);
      hoverMeteoTimeout = setTimeout(() => { caricaMeteoTraccia(); }, 400);
    }
  });

  layer.on('mouseout', function(e) {
    layer.setStyle({ weight: 5, opacity: 0.95 });
  });

  layer.on('click', function(e) {
    selectedLayerForMeteo = layer;
    if (document.getElementById('chk-autoupdate-meteo').checked) caricaMeteoTraccia();
  });
}

function renderMeteoResult(data, nomePercorso, dataInput, oraInput) {
  const container = document.getElementById('risultato-meteo');
  const oraFormattata = oraInput.split(':')[0].padStart(2, '0');
  const indexInizio = data.hourly.time.findIndex(t => t.startsWith(`${dataInput}T${oraFormattata}`));
  
  if (indexInizio !== -1) {
    let orarioDettagliHtml = `<div style="background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ddd; max-height: 180px; overflow-y: auto;">`;
    let minTemp = Infinity, maxTemp = -Infinity, peggiorEmoji = '☀️', maxSeverity = 0;

    for (let i = 0; i <= 3; i++) {
      if (indexInizio + i < data.hourly.time.length) {
        const idx = indexInizio + i;
        const oraSlot = data.hourly.time[idx].split('T')[1];
        const tempSlot = data.hourly.temperature_2m[idx];
        const pioggiaSlot = data.hourly.precipitation_probability[idx];
        let emojiSlot = getMeteoEmoji(data.hourly.weathercode[idx]);
        
        if (pioggiaSlot >= 50 && ['☁️','⛅','☀️'].includes(emojiSlot)) emojiSlot = '🌧️';
        if (tempSlot < minTemp) minTemp = tempSlot;
        if (tempSlot > maxTemp) maxTemp = tempSlot;

        if (getMeteoSeverity(emojiSlot) > maxSeverity) { maxSeverity = getMeteoSeverity(emojiSlot); peggiorEmoji = emojiSlot; }
        orarioDettagliHtml += `• <strong>${oraSlot}</strong>: ${emojiSlot} ${tempSlot}°C, 💧${pioggiaSlot}%<br>`;
      }
    }
    container.innerHTML = `<div>Traccia: ${peggiorEmoji} (${minTemp}°C - ${maxTemp}°C)</div>` + orarioDettagliHtml + `</div>`;
  } else {
    container.innerHTML = "Dati non disponibili per questa data.";
  }
}

async function caricaMeteoTraccia() {
  const container = document.getElementById('risultato-meteo');
  if (!selectedLayerForMeteo) return;
  const dataInput = document.getElementById('data-partenza').value;
  const oraInput = document.getElementById('ora-partenza').value;
  if (!dataInput) return;
  
  const center = selectedLayerForMeteo.getBounds().getCenter();
  const cacheKey = `${center.lat.toFixed(3)}_${center.lng.toFixed(3)}_${dataInput}`;
  
  if (trackMeteoCache.has(cacheKey)) {
    renderMeteoResult(trackMeteoCache.get(cacheKey), selectedLayerForMeteo.feature.properties.name, dataInput, oraInput);
    return;
  }

  container.innerHTML = "Caricamento...";
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${center.lat.toFixed(4)}&longitude=${center.lng.toFixed(4)}&forecast_days=3&hourly=temperature_2m,precipitation_probability,weathercode&timezone=auto`;
    const response = await fetch(url);
    if (!response.ok) throw new Error("Rate");
    const data = await response.json();
    trackMeteoCache.set(cacheKey, data);
    renderMeteoResult(data, selectedLayerForMeteo.feature.properties.name, dataInput, oraInput);
  } catch (error) {
    container.innerHTML = "⚠️ Riprova tra poco.";
  }
}

// -------------------------------------------------------------
// L'ALGORITMO DEFINITIVO: HASHING SPAZIALE ADATTIVO
// Genera le griglie regionali SOLO dove ci sono sentieri e scala 
// la risoluzione in automatico per non superare mai le chiamate API
// -------------------------------------------------------------
async function load3DaysWeatherGrid() {
  if (heatmap3DaysCache) {
    renderWeatherGridFromCache();
    return;
  }

  const activeFeatures = geoJsonLayer ? geoJsonLayer.toGeoJSON().features : (allData ? allData.features : []);
  if (activeFeatures.length === 0) return;

  const MAX_SAFE_POINTS = 45; // Mantieniti un po' sotto i 50 per scurezza
  let gridSize = 0.15; // Inizia con alta risoluzione (circa 15km a cella)
  let finalPoints = [];

  // Ciclo adattivo: se i punti regionali sono troppi (limite API), 
  // allarga la scacchiera e unifica le regioni finché non rientrano nel limite.
  while (gridSize <= 3.0) {
    let pointSet = new Set();
    
    activeFeatures.forEach(feature => {
      const tempL = L.geoJSON(feature);
      if (tempL.getBounds().isValid()) {
        const center = tempL.getBounds().getCenter();
        
        // "Aggancia" il sentiero alla cella più vicina della scacchiera
        const latCell = Math.round(center.lat / gridSize) * gridSize;
        const lonCell = Math.round(center.lng / gridSize) * gridSize;

        // Aggiunge la cella e gli 8 vicini per formare la "regione" meteo (3x3)
        for (let i = -1; i <= 1; i++) {
          for (let j = -1; j <= 1; j++) {
            const pLat = (latCell + i * gridSize).toFixed(3);
            const pLon = (lonCell + j * gridSize).toFixed(3);
            pointSet.add(`${pLat},${pLon}`);
          }
        }
      }
    });

    if (pointSet.size > 0 && pointSet.size <= MAX_SAFE_POINTS) {
      // Risoluzione perfetta trovata
      finalPoints = Array.from(pointSet).map(str => {
        const parts = str.split(',');
        return { lat: parts[0], lon: parts[1] };
      });
      break; 
    } else {
      // Punti eccedenti: allarga la maglia per forzare fusioni di celle
      gridSize += 0.1;
    }
  }

  // Fallback di sicurezza estrema nel caso l'utente abbia sentieri in 3 continenti diversi
  if (finalPoints.length === 0) {
    // Esiste almeno un set ma era > MAX_SAFE_POINTS al limite del ciclo
    finalPoints = Array.from(pointSet || new Set()).slice(0, MAX_SAFE_POINTS).map(str => {
      const parts = str.split(',');
      return { lat: parts[0], lon: parts[1] };
    });
  }

  if (finalPoints.length === 0) return;

  const latitudeQueries = finalPoints.map(p => p.lat);
  const longitudeQueries = finalPoints.map(p => p.lon);

  const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitudeQueries.join(',')}&longitude=${longitudeQueries.join(',')}&forecast_days=3&hourly=precipitation_probability&timezone=auto`;

  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error("API Limit");
    const data = await res.json();
    heatmap3DaysCache = Array.isArray(data) ? data : [data];
    renderWeatherGridFromCache();
  } catch (err) {
    console.error("Errore caricamento griglia adattiva", err);
  }
}

function renderWeatherGridFromCache() {
  if (!heatmap3DaysCache || !map.hasLayer(heatLayer)) return;

  const selectedDate = document.getElementById('data-partenza').value;
  const targetHour = intervals[currentStepIndex];
  const searchTime = `${selectedDate}T${String(targetHour).padStart(2, '0')}:00`;

  let heatPoints = [];
  heatmap3DaysCache.forEach(location => {
    const timeIndex = location.hourly.time.indexOf(searchTime);
    if (timeIndex !== -1) {
      const rainProb = location.hourly.precipitation_probability[timeIndex] || 0;
      if (rainProb > 5) heatPoints.push([location.latitude, location.longitude, rainProb]);
    }
  });

  heatLayer.setLatLngs(heatPoints);
}

function changeForecastStep(value) {
  currentStepIndex = parseInt(value, 10);
  document.getElementById('time-display').innerText = `${String(intervals[currentStepIndex]).padStart(2, '0')}:00`;
  renderWeatherGridFromCache(); 
}

function applyFilters() {
  if (!allData) return;
  const diffVal = document.getElementById('filter-difficolta').value;
  let distMin = parseFloat(document.getElementById('filter-dist-min').value);
  let distMax = parseFloat(document.getElementById('filter-dist-max').value);
  if (distMin > distMax) [distMin, distMax] = [distMax, distMin];
  
  const filteredFeatures = allData.features.filter(f => {
    return (diffVal === 'Tutte' || f.properties.difficolta === diffVal) && 
           (f.properties.km >= distMin && f.properties.km <= distMax);
  });

  if (geoJsonLayer) map.removeLayer(geoJsonLayer);
  geoJsonLayer = L.geoJSON({ type: 'FeatureCollection', features: filteredFeatures }, {
    style: f => ({ color: getNeonColor(f.properties.difficolta), weight: 5, opacity: 0.95 }),
    onEachFeature: onEachFeature
  }).addTo(map);
  
  document.getElementById('stats').textContent = `Mostrati: ${filteredFeatures.length} di ${allData.features.length} percorsi`;
}

document.querySelectorAll('select, input[type="range"], input[type="checkbox"]').forEach(el => {
  if(el.id !== 'chk-autoupdate-meteo' && el.id !== 'time-slider') el.addEventListener('change', applyFilters);
  if(el.type === 'range' && el.id !== 'time-slider') el.addEventListener('input', applyFilters);
});

document.getElementById('btn-meteo').addEventListener('click', caricaMeteoTraccia);

document.getElementById('data-partenza').addEventListener('change', () => {
  renderWeatherGridFromCache();
  if (document.getElementById('chk-autoupdate-meteo').checked && selectedLayerForMeteo) caricaMeteoTraccia();
});

fetch('percorsi.geojson')
  .then(res => res.json())
  .then(data => {
    allData = data; applyFilters();
    if (geoJsonLayer) map.fitBounds(geoJsonLayer.getBounds(), { padding: [30, 30] });
  });
</script>
</body>
</html>
