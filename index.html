<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappa Trekking Automatica ed Ultra-Leggera</title>

<!-- Leaflet CSS Stylesheet for map rendering and controls[cite: 1] -->
<link rel="stylesheet" href="https://unpkg.com" />

<style>
/* Reset browser defaults and setup flexbox layout split between sidebar and map[cite: 1] */
body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }

/* Fixed 300px sidebar overlay on the left for user controls[cite: 1] */
#sidebar { width: 300px; padding: 20px; background: #f4f4f4; z-index: 1000; box-shadow: 2px 0 5px rgba(0,0,0,0.1); box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }

/* Interactive map container fills all remaining viewport width[cite: 1] */
#map { flex-grow: 1; height: 100%; }

/* Form layout styling for dynamic sidebar filter controls[cite: 1] */
.filter-group { display: flex; flex-direction: column; gap: 5px; }
label { font-weight: bold; font-size: 14px; }
select, input[type="range"] { width: 100%; padding: 5px; box-sizing: border-box; }
#counter { font-size: 13px; color: #555; font-style: italic; }
</style>
</head>
<body>

<!-- SIDEBAR INTERFACE FOR CUMULATIVE FILTERS[cite: 1] -->
<div id="sidebar">
<h3>Filtri Cumulativi</h3>

<!-- Filter 1: Trail Difficulty Dropdown[cite: 1] -->
<div class="filter-group">
<label for="difficolta">Difficoltà:</label>
<select id="difficolta" onchange="applicaFiltri()">
<option value="tutte">Tutte</option>
<option value="Facile">Facile (Salita < 400m)</option>
<option value="Media">Media (Salita 400-800m)</option>
<option value="Difficile">Difficile (Salita > 800m)</option>
</select>
</div>

<!-- Filter 2: Maximum Distance Slider[cite: 1] -->
<div class="filter-group">
<label>Km Massimi: <span id="km-val">25</span> km</label>
<input type="range" id="km-max" min="0" max="50" value="25" oninput="document.getElementById('km-val').innerText = this.value; applicaFiltri()">
</div>

<!-- Filter 3: Estimated Duration Dropdown[cite: 1] -->
<div class="filter-group">
<label for="durata">Durata Stimata:</label>
<select id="durata" onchange="applicaFiltri()">
<option value="tutte">Tutte</option>
<option value="Mezza Giornata">Mezza Giornata (≤ 10 km)</option>
<option value="Giornata Intera">Giornata Intera (> 10 km)</option>
</select>
</div>

<hr style="width: 100%; margin: 5px 0; border: 0; border-top: 1px solid #ccc;">

<!-- Real-time counter showing visible vs total matching trails[cite: 1] -->
<div id="counter">Caricamento tracciati...</div>
</div>

<!-- MAIN INTERACTIVE MAP CONTAINER[cite: 1] -->
<div id="map"></div>

<!-- Leaflet JavaScript Map Engine[cite: 1] -->
<script src="https://unpkg.com"></script>

<script>
// Initialize Leaflet map engine centered over the Dolomites region [lat, lon], zoom level 10[cite: 1]
const map = L.map('map').setView([46.26, 11.79], 10);

// Load and render open-source OpenTopoMap topographic basemap tiles[cite: 1]
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
maxZoom: 17,
attribution: 'Map data: © OpenStreetMap'
}).addTo(map);

let geojsonLayer;
let masterTrailsData = null;

// Fetch the single optimized GeoJSON database generated by GitHub Actions[cite: 1]
fetch('percorsi.geojson')
.then(response => response.json())
.then(data => {
masterTrailsData = data;
applicaFiltri(); // Render tracks once data is successfully loaded[cite: 1]
})
.catch(err => {
document.getElementById('counter').innerText = "Errore database. Generazione in corso?";
console.error("GeoJSON not ready yet:", err);
});

// Core dynamic filtering engine using cumulative AND logic[cite: 1]
function applicaFiltri() {
if (!masterTrailsData) return;

// Clear existing track vectors from map to redraw filtered paths cleanly[cite: 1]
if (geojsonLayer) { map.removeLayer(geojsonLayer); }

// Extract active filter parameters from sidebar controls[cite: 1]
const diffSelezionata = document.getElementById('difficolta').value;
const kmMassimi = parseInt(document.getElementById('km-max').value);
const durataSelezionata = document.getElementById('durata').value;

let visibleCount = 0;

// Filter and render track geometries dynamically[cite: 1]
geojsonLayer = L.geoJSON(masterTrailsData, {
filter: function(feature) {
const props = feature.properties;

// Evaluate track properties against selected filter criteria[cite: 1]
const rispettaDiff = (diffSelezionata === "tutte" || props.difficolta === diffSelezionata);
const rispettaKm = (props.km <= kmMassimi);
const rispettaDurata = (durataSelezionata === "tutte" || props.durata === durataSelezionata);

// Returns true ONLY when all conditions match simultaneously (cumulative AND logic)[cite: 1]
const isMatch = rispettaDiff && rispettaKm && rispettaDurata;
if (isMatch) visibleCount++;
return isMatch;
},
style: function(feature) {
// Dynamically set path line color based on calculated trail difficulty[cite: 1]
let lineCol = "green";
if(feature.properties.difficolta === "Media") lineCol = "orange";
if(feature.properties.difficolta === "Difficile") lineCol = "red";
return { color: lineCol, weight: 4, opacity: 0.8 };
},
onEachFeature: function(feature, layer) {
// Bind popup tooltip window displaying track details on click[cite: 1]
layer.bindPopup(`<strong>${feature.properties.name}</strong><br>
Distanza: ${feature.properties.km} km<br> Dislivello: +${feature.properties.dislivello}m<br>
Durata: ${feature.properties.durata}`);
}
}).addTo(map);

// Update trail count display in sidebar[cite: 1]
document.getElementById('counter').innerText = `Mostrati: ${visibleCount} di ${masterTrailsData.features.length} percorsi`;
}
</script>
</body>
</html>
