<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappa Percorsi GPX</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; display: flex; }
#sidebar { width: 320px; height: 100%; background: #f8f9fa; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; z-index: 1000; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
#sidebar h2 { margin-top: 0; font-size: 1.2rem; margin-bottom: 20px; }
.filter-group { margin-bottom: 18px; }
.filter-group label { display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 6px; }
.filter-group select { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; }
.checkbox-group { display: flex; gap: 15px; margin-top: 5px; }
.checkbox-group label { font-weight: normal; font-size: 0.85rem; cursor: pointer; }
.range-val { float: right; font-size: 0.85rem; color: #555; font-weight: normal; }
.range-sliders { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-row span { font-size: 0.75rem; color: #666; width: 30px; }
.slider-row input[type="range"] { flex: 1; }
#stats { font-style: italic; color: #777; font-size: 0.85rem; margin-top: 25px; }
#map { flex: 1; height: 100%; }
.leaflet-interactive { filter: drop-shadow(0px 0px 3px currentColor); transition: stroke-width 0.15s ease; }
.popup-right { margin-bottom: 0 !important; }
.popup-right .leaflet-popup-tip-container { display: none !important; }
.popup-right .leaflet-popup-content-wrapper { position: relative; border-radius: 12px; padding: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
.popup-right .leaflet-popup-content-wrapper::before { content: ""; position: absolute; left: -6px; bottom: 26px; width: 14px; height: 14px; background: #ffffff; transform: rotate(45deg); z-index: -1; box-shadow: -2px 2px 3px rgba(0,0,0,0.15); border-radius: 2px; }
.popup-right .leaflet-popup-content { margin: 16px 22px 16px 16px !important; padding-right: 14px !important; max-height: 320px !important; overflow-y: auto !important; line-height: 1.5; color: #333; }
details { margin-top: 12px; background: #f7f7f7; padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #eaeaea; }
summary { font-weight: bold; cursor: pointer; color: #222; }
.details-content { margin-top: 8px; color: #444; word-break: break-word; }
@media (max-width: 768px) {
  body { flex-direction: column; }
  #sidebar { width: 100%; height: auto; max-height: 40vh; }
  #map { height: 60vh; }
}
</style>
</head>
<body>

<div id="sidebar">
  <h2>Filtri Percorsi</h2>
  
  <div class="filter-group">
    <label>Stato Percorso:</label>
    <div class="checkbox-group">
      <label><input type="checkbox" id="chk-fatte" checked> Completati</label>
      <label><input type="checkbox" id="chk-non-fatte" checked> Da Fare</label>
    </div>
  </div>

  <div class="filter-group">
    <label for="filter-difficolta">Difficoltà:</label>
    <select id="filter-difficolta">
      <option value="Tutte">Tutte</option>
      <option value="Facile">Facile</option>
      <option value="Media">Media</option>
      <option value="Difficile">Difficile</option>
      <option value="Molto Difficile">Molto Difficile</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Distanza (Km): <span id="val-dist" class="range-val">0 - 50 km</span></label>
    <div class="range-sliders">
      <div class="slider-row"><span>Min:</span><input type="range" id="filter-dist-min" min="0" max="50" value="0" step="1"></div>
      <div class="slider-row"><span>Max:</span><input type="range" id="filter-dist-max" min="0" max="50" value="50" step="1"></div>
    </div>
  </div>

  <div class="filter-group">
    <label>Dislivello + (m): <span id="val-dis-pos" class="range-val">0 - 2500 m</span></label>
    <div class="range-sliders">
      <div class="slider-row"><span>Min:</span><input type="range" id="filter-dis-pos-min" min="0" max="2500" value="0" step="50"></div>
      <div class="slider-row"><span>Max:</span><input type="range" id="filter-dis-pos-max" min="0" max="2500" value="2500" step="50"></div>
    </div>
  </div>

  <div class="filter-group">
    <label>Dislivello - (m): <span id="val-dis-neg" class="range-val">0 - 2500 m</span></label>
    <div class="range-sliders">
      <div class="slider-row"><span>Min:</span><input type="range" id="filter-dis-neg-min" min="0" max="2500" value="0" step="50"></div>
      <div class="slider-row"><span>Max:</span><input type="range" id="filter-dis-neg-max" min="0" max="2500" value="2500" step="50"></div>
    </div>
  </div>

  <div class="filter-group">
    <label for="filter-durata">Categoria Durata:</label>
    <select id="filter-durata">
      <option value="Tutte">Tutte</option>
      <option value="Mezza Giornata">Mezza Giornata</option>
      <option value="Giornata Intera">Giornata Intera</option>
    </select>
  </div>

  <div class="filter-group" style="margin-top: 25px; padding-top: 15px; border-top: 1px solid #ddd;">
    <label style="margin-bottom: 10px; color: #2c3e50;">Pianificatore Meteo:</label>
    <div style="margin-bottom: 8px;">
      <label><input type="checkbox" id="chk-autoupdate-meteo" checked> Autoupdate meteo su hover?</label>
    </div>
    <label for="data-partenza" style="font-size: 0.85rem; font-weight: normal; margin-bottom: 2px;">Data escursione:</label>
    <input type="date" id="data-partenza" style="width: 100%; margin-bottom: 8px; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
    
    <label for="ora-partenza" style="font-size: 0.85rem; font-weight: normal; margin-bottom: 2px;">Ora di partenza percorsi:</label>
    <input type="time" id="ora-partenza" value="10:00" style="width: 100%; margin-bottom: 10px; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
    
    <button id="btn-meteo" style="width: 100%; padding: 8px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Controlla Meteo Percorso
    </button>
    <div id="risultato-meteo" style="margin-top: 8px; margin-bottom: 15px; font-size: 0.85rem;">Passa con il mouse o seleziona un percorso</div>

    <div id="regione-meteo-controls" style="background: #edf2f7; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e0;">
      <label style="color: #2d3748; font-size: 0.85rem; margin-bottom: 4px;"><strong>Heatmap Precipitazioni (Passi 3h):</strong></label>
      <div style="font-size: 0.85rem; color: #4a5568; margin-bottom: 4px;">Ora selezionata: <span id="time-display" style="font-weight: bold;">12:00</span></div>
      <input type="range" id="time-slider" min="0" max="7" value="4" step="1" style="width: 100%; margin: 5px 0;" oninput="changeForecastStep(this.value)">
      <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: #718096;">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>21:00</span>
      </div>
    </div>
  </div>

  <div id="stats">Mostrati: 0 di 0 percorsi</div>
</div>

<div id="map"></div>

<!-- Leaflet JS & Plugin Heatmap -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<script>
const domani = new Date();
domani.setDate(domani.getDate() + 1);
const anno = domani.getFullYear();
const mese = String(domani.getMonth() + 1).padStart(2, '0');
const giorno = String(domani.getDate()).padStart(2, '0');
document.getElementById('data-partenza').value = `${anno}-${mese}-${giorno}`;

let allData = null;
let geoJsonLayer = null;
let selectedLayerForMeteo = null;

// Gestione Caching API e Debouncing per evitare il blocco richieste (Errori 429)
const trackMeteoCache = new Map();
let hoverMeteoTimeout = null;

const intervals = [0, 3, 6, 9, 12, 15, 18, 21];
let currentStepIndex = 4;
let globalWeatherDataCache = [];

// Configurazione Heatmap
let heatLayer = L.heatLayer([], {
  radius: 65,
  blur: 40,
  maxZoom: 12,
  max: 100,
  minOpacity: 0.25,
  gradient: {
    0.15: '#00bfff',
    0.45: '#0000ff',
    0.75: '#ffaa00',
    1.00: '#ff0000'
  }
});

const map = L.map('map').setView([46.4983, 11.3548], 10);
const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17,
  attribution: 'Map data: © OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap (CC-BY-SA)'
}).addTo(map);

const baseMaps = { "OpenTopoMap": topoLayer };
const overlayMaps = { "Heatmap Precipitazioni": heatLayer };

L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
// HeatLayer DISATTIVATO di default (non aggiunto alla mappa all'avvio)

let moveTimeout;
map.on('moveend', () => {
  if (map.hasLayer(heatLayer)) {
    clearTimeout(moveTimeout);
    moveTimeout = setTimeout(() => { updateRegionalWeather(); }, 400);
  }
});

map.on('overlayadd', function(e) {
  if (e.layer === heatLayer) { updateRegionalWeather(); }
});

function getNeonColor(difficolta) {
  switch (difficolta) {
    case 'Facile': return '#00FF66';
    case 'Media': return '#00E5FF';
    case 'Difficile': return '#FF5F00';
    case 'Molto Difficile': return '#FF007F';
    default: return '#00FF66';
  }
}

function getMeteoEmoji(weatherCode) {
  switch (weatherCode) {
    case 0: return '☀️';
    case 1: case 2: return '⛅';
    case 3: return '☁️';
    case 45: case 48: return '🌫️';
    case 51: case 53: case 55: case 56: case 57: 
    case 61: case 63: case 65: case 66: case 67: return '🌧️';
    case 71: case 73: case 75: case 77: case 85: case 86: return '❄️';
    case 80: case 81: case 82: return '🌦️';
    case 95: case 96: case 99: return '⚡';
    default: return '☁️';
  }
}

function getMeteoSeverity(emoji) {
  switch (emoji) {
    case '⚡': return 8;
    case '❄️': return 7;
    case '🌧️': return 6;
    case '🌦️': return 5;
    case '🌫️': return 4;
    case '☁️': return 3;
    case '⛅': return 2;
    case '☀️': return 1;
    default: return 0;
  }
}

function onEachFeature(feature, layer) {
  const p = feature.properties;
  const dislivelloNeg = (p.dislivello_neg !== undefined && p.dislivello_neg !== null) ? p.dislivello_neg : 0;
  const tempoStr = p.tempo_effettivo || p.durata || "";
  const sforzoVal = (p.sforzo !== undefined && p.sforzo !== null && !isNaN(p.sforzo)) ? Number(p.sforzo).toFixed(1) : null;
  const sforzoStr = sforzoVal ? ' (' + sforzoVal + ')' : "";
  const statoStr = (p.stato === 'fatta') ? 'Completato' : 'Da fare';
  
  let linkHtml = p.link ? `<div style="margin-top: 4px; margin-bottom: 10px;"><a href="${p.link}" target="_blank" rel="noopener noreferrer" style="color: #27ae60; font-weight: bold; text-decoration: none; font-size: 0.85rem;">Vedi su Wikiloc ↗</a></div>` : '';
  let imgHtml = p.image_url ? `<img src="${p.image_url}" style="width:100%; border-radius:6px; margin-bottom:8px;">` : "";
  
  const detailsHtml = `<details><summary>Maggiori dettagli</summary><div class="details-content"><strong>Stato: </strong>${statoStr}<br><strong>Data: </strong>${p.datatrekking || 'N/D'}<br><strong>In movimento: </strong>${p.tempo_movimento || 'N/D'}<br><strong>In pausa: </strong>${p.tempopausa || 'N/D'}<br><strong>File: </strong><code>${p.file_location || 'N/D'}</code></div></details>`;
  
  const popupContent = `<strong>${p.name}</strong><br>${linkHtml}${imgHtml}Distanza: ${p.km} km<br>Dislivello: +${p.dislivello}m / -${dislivelloNeg}m<br>Tempo totale: ${tempoStr}<br>Difficoltà: ${p.difficolta}${sforzoStr}<br>${detailsHtml}`;
  
  layer.bindPopup(popupContent, { className: 'popup-right', minWidth: 285, maxWidth: 285 });

  layer.on('mouseover', function(e) {
    selectedLayerForMeteo = layer;
    layer.setStyle({ weight: 8, opacity: 1 });
    if (document.getElementById('chk-autoupdate-meteo').checked) {
      clearTimeout(hoverMeteoTimeout);
      hoverMeteoTimeout = setTimeout(() => { caricaMeteoTraccia(); }, 200);
    }
  });

  layer.on('mouseout', function(e) {
    layer.setStyle({ weight: 5, opacity: 0.95 });
  });

  layer.on('click', function(e) {
    selectedLayerForMeteo = layer;
    if (document.getElementById('chk-autoupdate-meteo').checked) {
      caricaMeteoTraccia();
    }
  });
}

function renderMeteoResult(data, nomePercorso, dataInput, oraInput, pProps) {
  const containerRisultato = document.getElementById('risultato-meteo');
  const oraFormattata = oraInput.split(':')[0].padStart(2, '0');
  const indexInizio = data.hourly.time.findIndex(t => t.startsWith(`${dataInput}T${oraFormattata}`));
  
  const stringaTempoTotale = pProps.tempo_effettivo || pProps.durata || "3h";
  let durataOre = 3;
  const matchOre = stringaTempoTotale.match(/(\d+)\s*h/i);
  if (matchOre) durataOre = parseInt(matchOre[1], 10);
  durataOre = Math.max(1, Math.min(durataOre, 10));

  if (indexInizio !== -1) {
    let orarioDettagliHtml = `<div style="background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ddd; max-height: 180px; overflow-y: auto;"><strong style="color: #2c3e50; font-size: 0.9rem; display: block; margin-bottom: 4px;">📍 ${nomePercorso}</strong>`;
    let minTemp = Infinity, maxTemp = -Infinity;
    let peggiorEmoji = '☀️';
    let maxSeverity = 0;

    for (let i = 0; i <= durataOre; i++) {
      const currentIndex = indexInizio + i;
      if (currentIndex < data.hourly.time.length) {
        const oraSlot = data.hourly.time[currentIndex].split('T')[1];
        const tempSlot = data.hourly.temperature_2m[currentIndex];
        const pioggiaSlot = data.hourly.precipitation_probability[currentIndex];
        const wCode = data.hourly.weathercode[currentIndex];
        
        let emojiSlot = getMeteoEmoji(wCode);
        if (pioggiaSlot >= 50 && (emojiSlot === '☁️' || emojiSlot === '⛅' || emojiSlot === '☀️')) {
          emojiSlot = '🌧️';
        }

        if (tempSlot < minTemp) minTemp = tempSlot;
        if (tempSlot > maxTemp) maxTemp = tempSlot;

        const severityCurrent = getMeteoSeverity(emojiSlot);
        if (severityCurrent > maxSeverity) {
          maxSeverity = severityCurrent;
          peggiorEmoji = emojiSlot;
        }

        let etichettaTempo = (i === 0) ? "Partenza" : (i === durataOre ? "Arrivo" : `+${i}h`);
        orarioDettagliHtml += `• <strong>${oraSlot}</strong> (${etichettaTempo}): ${emojiSlot} ${tempSlot}°C, 💧${pioggiaSlot}%<br>`;
      }
    }
    orarioDettagliHtml += `</div>`;

    containerRisultato.innerHTML = `<div style="margin-bottom: 6px; font-weight: bold;">Meteo previsto per la traccia: ${peggiorEmoji} (${minTemp}°C - ${maxTemp}°C)</div>` + orarioDettagliHtml;
  } else {
    containerRisultato.innerHTML = "Nessun dato meteo disponibile per la data inserita.";
  }
}

async function caricaMeteoTraccia() {
  const containerRisultato = document.getElementById('risultato-meteo');
  if (!selectedLayerForMeteo) return;
  
  const pProps = selectedLayerForMeteo.feature.properties;
  const nomePercorso = pProps.name || "Percorso selezionato";
  const dataInput = document.getElementById('data-partenza').value;
  const oraInput = document.getElementById('ora-partenza').value;
  
  if (!dataInput) return;
  
  let lat, lon;
  if (selectedLayerForMeteo.getBounds) {
    const center = selectedLayerForMeteo.getBounds().getCenter();
    lat = center.lat;
    lon = center.lng;
  } else {
    containerRisultato.innerHTML = "Coordinate non valide.";
    return;
  }

  const cacheKey = `${lat.toFixed(3)}_${lon.toFixed(3)}_${dataInput}`;
  if (trackMeteoCache.has(cacheKey)) {
    renderMeteoResult(trackMeteoCache.get(cacheKey), nomePercorso, dataInput, oraInput, pProps);
    return;
  }

  containerRisultato.innerHTML = "Caricamento meteo...";

  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=temperature_2m,precipitation_probability,weathercode&timezone=auto`;
    const response = await fetch(url);
    if (!response.ok) throw new Error("API Limit");
    const data = await response.json();
    
    trackMeteoCache.set(cacheKey, data);
    renderMeteoResult(data, nomePercorso, dataInput, oraInput, pProps);
  } catch (error) {
    containerRisultato.innerHTML = "⚠️ Troppe richieste meteo ravvicinate. Riprova tra poco.";
  }
}

function updateRegionalWeather() {
  if (!map.hasLayer(heatLayer)) return;
  const selectedDate = document.getElementById('data-partenza').value;
  if (!selectedDate) return;

  const bounds = map.getBounds();
  const southWest = bounds.getSouthWest();
  const northEast = bounds.getNorthEast();

  // Grid Snapping: aggancia i punti di controllo a coordinate geografiche fisse (~6km)
  const step = 0.06;
  const minLat = Math.floor(southWest.lat / step) * step;
  const maxLat = Math.ceil(northEast.lat / step) * step;
  const minLng = Math.floor(southWest.lng / step) * step;
  const maxLng = Math.ceil(northEast.lng / step) * step;

  let latitudeQueries = [], longitudeQueries = [];

  for (let lat = minLat; lat <= maxLat + 0.001; lat += step) {
    for (let lng = minLng; lng <= maxLng + 0.001; lng += step) {
      latitudeQueries.push(lat.toFixed(4));
      longitudeQueries.push(lng.toFixed(4));
    }
  }

  // Limite sicurezza punti per prevenire query URLs troppo lunghe
  if (latitudeQueries.length > 81) {
    latitudeQueries = latitudeQueries.slice(0, 81);
    longitudeQueries = longitudeQueries.slice(0, 81);
  }

  const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitudeQueries.join(',')}&longitude=${longitudeQueries.join(',')}&start_date=${selectedDate}&end_date=${selectedDate}&hourly=precipitation_probability&timezone=auto`;

  fetch(apiUrl)
    .then(res => res.json())
    .then(data => {
      globalWeatherDataCache = Array.isArray(data) ? data : [data];
      renderWeatherGrid();
    })
    .catch(err => console.error("Errore download heatmap:", err));
}

function renderWeatherGrid() {
  if (!globalWeatherDataCache.length) return;

  const targetHour = intervals[currentStepIndex];
  let heatPoints = [];

  globalWeatherDataCache.forEach(location => {
    const lat = location.latitude;
    const lon = location.longitude;
    const rainProb = location.hourly.precipitation_probability[targetHour] || 0;
    
    if (rainProb > 5) {
      heatPoints.push([lat, lon, rainProb]);
    }
  });

  heatLayer.setLatLngs(heatPoints);
  heatLayer.redraw();
}

function changeForecastStep(value) {
  currentStepIndex = parseInt(value, 10);
  document.getElementById('time-display').innerText = `${String(intervals[currentStepIndex]).padStart(2, '0')}:00`;
  renderWeatherGrid();
}

function applyFilters() {
  if (!allData) return;

  const diffVal = document.getElementById('filter-difficolta').value;
  const durataVal = document.getElementById('filter-durata').value;
  const showFatte = document.getElementById('chk-fatte').checked;
  const showNonFatte = document.getElementById('chk-non-fatte').checked;

  let distMin = parseFloat(document.getElementById('filter-dist-min').value);
  let distMax = parseFloat(document.getElementById('filter-dist-max').value);
  let disPosMin = parseFloat(document.getElementById('filter-dis-pos-min').value);
  let disPosMax = parseFloat(document.getElementById('filter-dis-pos-max').value);
  let disNegMin = parseFloat(document.getElementById('filter-dis-neg-min').value);
  let disNegMax = parseFloat(document.getElementById('filter-dis-neg-max').value);

  if (distMin > distMax) [distMin, distMax] = [distMax, distMin];
  if (disPosMin > disPosMax) [disPosMin, disPosMax] = [disPosMax, disPosMin];
  if (disNegMin > disNegMax) [disNegMin, disNegMax] = [disNegMax, disNegMin];

  document.getElementById('val-dist').textContent = `${distMin} - ${distMax} km`;
  document.getElementById('val-dis-pos').textContent = `${disPosMin} - ${disPosMax} m`;
  document.getElementById('val-dis-neg').textContent = `${disNegMin} - ${disNegMax} m`;

  const filteredFeatures = allData.features.filter(feature => {
    const p = feature.properties;
    const isFatta = p.stato === 'fatta';
    const matchStato = (isFatta && showFatte) || (!isFatta && showNonFatte);
    const matchDiff = (diffVal === 'Tutte' || p.difficolta === diffVal);
    const matchDist = (p.km >= distMin && p.km <= distMax);
    const matchDisPos = (p.dislivello >= disPosMin && p.dislivello <= disPosMax);
    const matchDisNeg = ((p.dislivello_neg || 0) >= disNegMin && (p.dislivello_neg || 0) <= disNegMax);
    const matchDurata = (durataVal === 'Tutte' || p.durata === durataVal);

    return matchStato && matchDiff && matchDist && matchDisPos && matchDisNeg && matchDurata;
  });

  if (geoJsonLayer) map.removeLayer(geoJsonLayer);

  geoJsonLayer = L.geoJSON({ type: 'FeatureCollection', features: filteredFeatures }, {
    style: function(feature) {
      return { color: getNeonColor(feature.properties.difficolta), weight: 5, opacity: 0.95 };
    },
    onEachFeature: onEachFeature
  }).addTo(map);

  document.getElementById('stats').textContent = `Mostrati: ${filteredFeatures.length} di ${allData.features.length} percorsi`;
}

document.getElementById('filter-difficolta').addEventListener('change', applyFilters);
document.getElementById('filter-durata').addEventListener('change', applyFilters);
document.getElementById('chk-fatte').addEventListener('change', applyFilters);
document.getElementById('chk-non-fatte').addEventListener('change', applyFilters);

document.querySelectorAll('.filter-group input[type="range"]').forEach(el => {
  el.addEventListener('input', applyFilters);
});

document.getElementById('btn-meteo').addEventListener('click', caricaMeteoTraccia);

document.getElementById('data-partenza').addEventListener('change', () => {
  trackMeteoCache.clear();
  updateRegionalWeather();
  if (document.getElementById('chk-autoupdate-meteo').checked && selectedLayerForMeteo) {
    caricaMeteoTraccia();
  }
});

document.getElementById('ora-partenza').addEventListener('change', () => {
  if (document.getElementById('chk-autoupdate-meteo').checked && selectedLayerForMeteo) {
    caricaMeteoTraccia();
  }
});

fetch('percorsi.geojson?v=' + new Date().getTime())
  .then(response => response.json())
  .then(data => {
    allData = data;
    applyFilters();
    if (geoJsonLayer && geoJsonLayer.getBounds().isValid()) {
      map.fitBounds(geoJsonLayer.getBounds(), { padding: [30, 30] });
    }
  })
  .catch(error => console.error('Errore GeoJSON:', error));
</script>
