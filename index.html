<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Percorsi GPX</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    /* Soft neon glow effect on map tracks */
    .leaflet-interactive {
      filter: drop-shadow(0px 0px 3px currentColor);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Initialize Map
    const map = L.map('map').setView([46.4983, 11.3548], 10);

    // 2. Add OpenStreetMap Tile Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 3. Neon Color Mapping
    function getNeonColor(difficolta) {
      switch (difficolta) {
        case 'Facile':
          return '#00FF66'; // Electric Neon Green
        case 'Media':
          return '#00E5FF'; // Bright Cyan
        case 'Difficile':
          return '#FF5F00'; // Vivid Neon Orange
        case 'Molto Difficile':
          return '#FF007F'; // Hot Pink / Magenta
        default:
          return '#00FF66';
      }
    }

    // 4. Feature Popup and Interaction Behavior
    function onEachFeature(feature, layer) {
      const p = feature.properties;
      
      const dislivelloNeg = (p.dislivello_neg !== undefined && p.dislivello_neg !== null) ? p.dislivello_neg : 0;
      const tempoStr = p.tempo_effettivo || p.durata || '';

      const sforzoVal = (p.sforzo !== undefined && p.sforzo !== null && !isNaN(p.sforzo)) 
        ? Number(p.sforzo).toFixed(1) 
        : null;
      const sforzoStr = sforzoVal ? ' (' + sforzoVal + ')' : '';

      // Local image support
      let imgHtml = '';
      if (p.image_url) {
        imgHtml = '<br><img src="' + p.image_url + '" style="width:100%; max-height:140px; object-fit:cover; border-radius:6px; margin-top:6px;">';
      }

      // Wikiloc link support
      let linkHtml = '';
      if (p.link) {
        linkHtml = '<br><a href="' + p.link + '" target="_blank" rel="noopener noreferrer" style="color: #27ae60; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 5px;">Vedi su Wikiloc ↗</a>';
      }

      const popupContent = 
        '<strong>' + p.name + '</strong><br>' +
        'Distanza: ' + p.km + ' km<br>' +
        'Dislivello: +' + p.dislivello + 'm / -' + dislivelloNeg + 'm<br>' +
        'Tempo registrato: ' + tempoStr + '<br>' +
        'Difficoltà: ' + p.difficolta + sforzoStr +
        imgHtml +
        linkHtml;

      // Bind click popup (needed for mobile tap)
      layer.bindPopup(popupContent);

      // Desktop mouseover/mouseout (ignores mobile touch events)
      layer.on({
        mouseover: function(e) {
          if (e.originalEvent && e.originalEvent.pointerType !== 'touch') {
            this.openPopup();
          }
        },
        mouseout: function(e) {
          if (e.originalEvent && e.originalEvent.pointerType !== 'touch') {
            this.closePopup();
          }
        }
      });
    }

    // 5. Fetch GeoJSON and Render
    fetch('percorsi.geojson?v=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        const geoJsonLayer = L.geoJSON(data, {
          style: function(feature) {
            return {
              color: getNeonColor(feature.properties.difficolta),
              weight: 5,
              opacity: 0.95,
              lineCap: 'round',
              lineJoin: 'round'
            };
          },
          onEachFeature: onEachFeature
        }).addTo(map);

        // Auto-fit map boundaries to all tracks
        if (geoJsonLayer.getBounds().isValid()) {
          map.fitBounds(geoJsonLayer.getBounds(), { padding: [30, 30] });
        }
      })
      .catch(error => console.error('Error loading GeoJSON:', error));
  </script>
</body>
</html>
